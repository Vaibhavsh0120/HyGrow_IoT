name: hygrow-tests
services:
  mailpit-test:
    image: axllent/mailpit:v1.32.0
    ports: ["127.0.0.1:8026:8025"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 2s
      retries: 30
  db-test:
    image: postgres:17.7-bookworm
    environment:
      POSTGRES_DB: hygrow_test
      POSTGRES_USER: hygrow_test
      POSTGRES_PASSWORD: local-disposable-tests-only
    ports: ["127.0.0.1:5549:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hygrow_test -d hygrow_test"]
      interval: 2s
      timeout: 2s
      retries: 30
  redis-test:
    image: redis:8.2.2-bookworm
    ports: ["127.0.0.1:6389:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
