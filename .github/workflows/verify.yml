name: Quality and containers
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
        working-directory: app
      - run: dart format --output=none --set-exit-if-changed lib test
        working-directory: app
      - run: flutter analyze
        working-directory: app
      - run: flutter test
        working-directory: app
  android:
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-flutter
      - name: Restore release signing in private ephemeral files
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PROPERTIES: ${{ secrets.ANDROID_SIGNING_PROPERTIES_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          for name, relative in [('KEYSTORE', 'app/android/hygrow-release.jks'), ('PROPERTIES', 'app/android/key.properties')]:
              value = os.environ.get(name)
              if not value:
                  raise SystemExit('Release signing secret is missing: ' + name)
              path = Path(relative)
              with path.open('xb') as output:
                  path.chmod(0o600)
                  output.write(base64.b64decode(value, validate=True))
          PY
      - run: flutter pub get --enforce-lockfile
        working-directory: app
      - name: Build actual signed release APKs
        run: |
          python3 tools/native_artifacts.py stamp --revision "${{ github.sha }}"
          cd app
          flutter build apk --release --split-per-abi --dart-define=API_BASE_URL=https://hygrow-india.duckdns.org
      - name: Verify signer, identity and version; record source and checksums
        run: |
          mkdir -p delivery
          version=$(tr -d '\r\n' < VERSION)
          for abi in armeabi-v7a arm64-v8a x86_64; do
            cp "app/build/app/outputs/flutter-apk/app-$abi-release.apk" "delivery/HyGrow-$version-$abi.apk"
          done
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          python3 tools/native_artifacts.py android --input delivery/*.apk --revision "${{ github.sha }}" --output delivery/android-build.json --apksigner "$build_tools/apksigner" --aapt "$build_tools/aapt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-android
          path: delivery/*
          if-no-files-found: error
          retention-days: 30
      - name: Remove ephemeral signing material
        if: always()
        run: rm -f app/android/hygrow-release.jks app/android/key.properties
  ios:
    needs: native
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-flutter
      - run: xcodebuild -version
      - run: flutter pub get --enforce-lockfile
        working-directory: app
      - name: Build unsigned release for actual iOS devices
        run: |
          python3 tools/native_artifacts.py stamp --revision "${{ github.sha }}"
          cd app
          flutter build ios --release --no-codesign --dart-define=API_BASE_URL=https://hygrow-india.duckdns.org
      - name: Package and verify unsigned device IPA
        run: |
          set -euo pipefail
          version=$(tr -d '\r\n' < VERSION)
          mkdir -p "$RUNNER_TEMP/ipa/Payload" delivery
          ditto app/build/ios/iphoneos/Runner.app "$RUNNER_TEMP/ipa/Payload/Runner.app"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/ipa/Payload" "delivery/HyGrow-$version-unsigned.ipa"
          python3 tools/native_artifacts.py ios --input delivery/*.ipa --revision "${{ github.sha }}" --output delivery/ios-build.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-ios-unsigned
          path: delivery/*
          if-no-files-found: error
          retention-days: 30
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check dashboard assets
        run: python firmware/tools/test-web-assets.py
      - run: pip install platformio==6.1.18
      - name: Compile with example configuration
        working-directory: firmware
        run: |
          cp example.secrets.h secrets.h
          pio run -e esp32-s3-n16r8
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Run firmware regression suite
        run: python firmware/tools/test-all.py
  api:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.7-bookworm
        env:
          POSTGRES_USER: hygrow_test
          POSTGRES_PASSWORD: local-disposable-tests-only
          POSTGRES_DB: hygrow_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U hygrow_test -d hygrow_test" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8.2.2-bookworm
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.32.0
        ports: ['8026:8025']
        options: --health-cmd "/mailpit readyz" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      HYGROW_TEST_DATABASE_URL: postgres://hygrow_test:local-disposable-tests-only@127.0.0.1:5432/hygrow_test
      HYGROW_TEST_REDIS_URL: redis://127.0.0.1:6379
      HYGROW_TEST_MAILPIT_URL: http://127.0.0.1:8026
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: services/api
      - run: npm test
        working-directory: services/api
      - run: npm audit --omit=dev --audit-level=high
        working-directory: services/api
      - name: Validate Compose configuration
        run: |
          python3 - <<'PY'
          import secrets
          from pathlib import Path
          names = ['LOCAL_DATABASE_PASSWORD', 'LOCAL_REDIS_PASSWORD', 'LOCAL_AUTH_OTP_PEPPER', 'LOCAL_AUTH_ENCRYPTION_KEY']
          Path('.env').write_text(''.join(name + '=' + secrets.token_hex(32) + '\n' for name in names))
          PY
          docker compose --env-file .env -f infra/compose.yaml config --quiet
          docker compose -f infra/compose.test.yaml config --quiet
      - name: Build and smoke test actual production container
        run: |
          docker compose --env-file .env -f infra/compose.yaml up -d --build --wait --wait-timeout 120
          curl --fail --silent http://localhost:8088/health/ready
          test "$(docker compose --env-file .env -f infra/compose.yaml exec -T api id -u)" != 0
      - name: Stop disposable CI services
        if: always()
        run: docker compose --env-file .env -f infra/compose.yaml down
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Test real age encryption and manifest safety
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y age
          python -m unittest discover -s tools/tests -p test_secrets.py -v
          python -m unittest discover -s tools/tests -p test_diagnostics.py -v
          python -m unittest discover -s tools/tests -p test_native_artifacts.py -v
          python tools/project_secrets.py check
      - name: Secret scan with checksum-verified gitleaks
        run: |
          cd "$RUNNER_TEMP"
          base=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1
          curl -fsSL "$base/gitleaks_8.30.1_linux_x64.tar.gz" -o gitleaks.tar.gz
          curl -fsSL "$base/gitleaks_8.30.1_checksums.txt" -o checksums.txt
          expected=$(awk '/linux_x64.tar.gz$/ { print $1 }' checksums.txt)
          test -n "$expected"
          printf '%s  gitleaks.tar.gz\n' "$expected" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" dir . --redact --no-banner
  manager:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools/tests -p test_manager.py -v
  publish:
    if: github.ref == 'refs/heads/main'
    needs: [firmware, api, secrets, manager, native, android, ios]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-api" >> "$GITHUB_OUTPUT"
          echo "version=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: image
        with:
          context: .
          file: services/api/Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.image }}:sha-${{ github.sha }}
          build-args: SOURCE_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.metadata.outputs.version }}
            org.opencontainers.image.created=${{ steps.metadata.outputs.created }}
            org.opencontainers.image.description=HyGrow Fastify API
          provenance: true
          sbom: true
      - name: Record immutable image and source
        run: |
          echo 'Image: `${{ steps.metadata.outputs.image }}@${{ steps.image.outputs.digest }}`' >> "$GITHUB_STEP_SUMMARY"
          echo 'Source: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Publishing an image does not verify Oracle deployment.' >> "$GITHUB_STEP_SUMMARY"
  release:
    if: github.ref == 'refs/heads/main'
    needs: [firmware, api, secrets, manager, native, android, ios]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Fetch verified build artifacts from this exact run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ github.run_id }}" --name native-android --dir delivery
          gh run download "${{ github.run_id }}" --name native-ios-unsigned --dir delivery
      - name: Publish versioned development release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(tr -d '\r\n' < VERSION)
          tag="v$version"
          git fetch --depth 1 origin "refs/tags/$tag"
          test "$(git rev-parse 'FETCH_HEAD^{}')" = "${{ github.sha }}"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          for name in ['android', 'ios']:
              record = json.loads(Path(f'delivery/{name}-build.json').read_text())
              assert record['sourceRevision'] == os.environ['GITHUB_SHA'], 'Artifact source mismatch'
          PY
          (cd delivery && sha256sum *.apk *.ipa > SHA256SUMS)
          git for-each-ref --format='%(contents)' "refs/tags/$tag" > "$RUNNER_TEMP/release-notes.md"
          printf '\nSource: [%s](%s/%s/commit/%s)\n\n' "${{ github.sha }}" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "${{ github.sha }}" >> "$RUNNER_TEMP/release-notes.md"
          cat >> "$RUNNER_TEMP/release-notes.md" <<'EOF'
          Development checkpoint. See the root README's current capability boundaries and version plan.

          Android APKs use the persistent HyGrow release key. Choose arm64-v8a for most modern phones; x86_64 is for compatible emulators/devices.

          The IPA is an **unsigned ARM64 device release**, not an App Store upload or simulator package. Signing/sideloading is required before installation. An iOS CI build does not prove runtime behavior on an iPhone/iPad.

          Source revisions, bundle identities, versions, signing state and SHA-256 hashes are recorded in the attached build metadata and SHA256SUMS.
          EOF
          gh release create "$tag" delivery/* --verify-tag --prerelease --title "HyGrow $version" --notes-file "$RUNNER_TEMP/release-notes.md"
